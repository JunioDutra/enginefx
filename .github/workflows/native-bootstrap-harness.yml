name: Native bootstrap harness

on:
  pull_request:
    paths:
      - 'src/br/com/engine/core/**'
      - 'src/br/com/engine/main/**'
      - 'src/br/com/engine/resources/**'
      - 'src/br/com/engine/scripting/**'
      - 'src/br/com/engine/componentes/scripts/**'
      - 'tests/**'
      - 'src/META-INF/native-image/**'
      - 'bootstrap-harness/**'
      - 'lua-harness/**'
      - 'pom.xml'
      - '.github/workflows/native-bootstrap-harness.yml'
  push:
    paths:
      - 'src/br/com/engine/core/**'
      - 'src/br/com/engine/main/**'
      - 'src/br/com/engine/resources/**'
      - 'src/br/com/engine/scripting/**'
      - 'src/br/com/engine/componentes/scripts/**'
      - 'tests/**'
      - 'src/META-INF/native-image/**'
      - 'bootstrap-harness/**'
      - 'lua-harness/**'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bootstrap:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GraalVM Community 25.3.4.1 (JDK 25.0.4.1)
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'graalvm-bootstrap.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'graalvm-bootstrap'
          Invoke-WebRequest 'https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.3.4.1/graalvm-community-jdk-25i3-25.0.4.1_windows-x64_bin.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '770a0d78aba4c19bd40ee410ec82afbbee8e33fdd762e509006ac64e1007b4ce') {
            throw 'Unexpected GraalVM archive checksum'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $jdk = Join-Path $destination 'graalvm-community-25.3.4.1+1.1'
          . .\lua-harness\native-common.ps1
          Set-HarnessToolchain $jdk
          "JAVA_HOME=$jdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - shell: pwsh
        run: .\lua-harness\verify-bootstrap-native.ps1 -JavaHome $env:JAVA_HOME
